<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Arvore de links test</title>
    <style>
        body {
            background-image: url("https://i.ibb.co/3YcbtVrq/nucleo-roxo.jpg");
            color: #8e12db;
            text-align: center;
        }

        img {
            border-radius: 50%;
            border: 6px solid purple;
            display: block; /* Faz a imagem se comportar como bloco */
            margin: 15px auto; /* Centraliza horizontalmente e dá um espaço em cima/baixo */

        }

        h1 {
            background-color: #170533;
            border-radius: 12px; /* Arredondando o H1 como pedido */
            display: inline-block;
            padding: 5px 10px; /* aumenta e diminui os textos das tags H1 */
        }

        h1 a {
            color: #8e12db;
            text-decoration: none;
            font-size: 20px; /* Aumenta o tamanho do texto dentro do balão */
        }

        p.round3 {
            border: 2px solid purple;
            border-left-width: 4px;
            border-radius: 12px;
            padding: 8px;
            background-color: #170533;
            color: #8e12db;
            width: 50%; /* diminui e aumenta o tamanho dos balões */
            margin: 10px auto;
        }
    </style>
</head>
<body>

    <!-- Imagem de perfil -->
    <img src="https://i.ibb.co/99Rxhbbt/photo-2024-10-11-18-18-35.jpg" alt="Foto de perfil" border="0">

    <!-- Bloco 1 -->
    <h1>
        <a href="https://minetestdicas.blogspot.com/">Minetest</a>
    </h1>
    <p class="round3">Descubra tudo sobre Minetest</p>

    <!-- Bloco 2 -->
    <h1>
        <a href="https://ogawayamano.itch.io/">Ogawayamano</a>
    </h1>
    <p class="round3">Descubra tudo sobre Ogawayamano</p>

    <!-- Bloco 3 -->
    <h1>
        <a href="https://gachalifebr.blogspot.com/">Gacha life BR</a>
    </h1>
    <p class="round3">Descubra tudo sobre gacha life</p>

    <!-- AddToAny BEGIN -->
    <div class="a2a_kit a2a_kit_size_32 a2a_default_style" style="justify-content: center; display: flex; margin-top: 20px;">
        <a class="a2a_dd" href="https://www.addtoany.com/share"></a>
        <a class="a2a_button_facebook"></a>
        <a class="a2a_button_pinterest"></a>
        <a class="a2a_button_telegram"></a>

</html>
